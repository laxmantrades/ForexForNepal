name: Build, Push, and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 440744253012.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and Push Docker Image
        run: |
          docker build -t 440744253012.dkr.ecr.ap-south-1.amazonaws.com/backendforexfornepal:latest ./server
          docker push 440744253012.dkr.ecr.ap-south-1.amazonaws.com/backendforexfornepal:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            # Login to ECR on EC2
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 440744253012.dkr.ecr.ap-south-1.amazonaws.com
            
            # Pull the latest image
            sudo docker pull 440744253012.dkr.ecr.ap-south-1.amazonaws.com/backendforexfornepal:latest
            
            # Stop and remove old container if exists
            sudo docker stop backend || true
            sudo docker rm backend || true
            
            # Run new container with .env (ensure the file exists on EC2)
            sudo docker run \
              --name backend \
              --env-file /home/ubuntu/.env \
              -p 5005:5005 \
              -d \
              440744253012.dkr.ecr.ap-south-1.amazonaws.com/backendforexfornepal:latest
            
            # Cleanup unused images to save space
            sudo docker image prune -af